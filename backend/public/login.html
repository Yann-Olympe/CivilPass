<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Citoyen - CivilPass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            word-break: break-all;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .token-display {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border: 1px solid #dee2e6;
        }
        
        .token-display h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .token-box {
            background: white;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 3px;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
            color: #495057;
        }
        
        .copy-btn {
            background: #28a745;
            padding: 8px 15px;
            font-size: 12px;
            margin-top: 10px;
            width: auto;
            display: inline-block;
        }
        
        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Connexion CivilPass</h1>
        <p class="subtitle">Connectez-vous à votre compte</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="email@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe *</label>
                <input type="password" id="password" name="password" required placeholder="Votre mot de passe">
            </div>
            
            <button type="submit" id="submitBtn">Se connecter</button>
            <div class="loading" id="loading">⏳ Connexion en cours...</div>
        </form>
        
        <div class="token-display" id="tokenDisplay">
            <h3>✅ Connexion réussie !</h3>
            <p>Voici votre token d'authentification :</p>
            <div class="token-box" id="tokenBox"></div>
            <button type="button" class="copy-btn" onclick="copyToken()">📋 Copier le token</button>
        </div>
        
        <div class="register-link">
            Veuillez contacter l'administration pour accéder à votre compte.
        </div>
    </div>
    
    <script>
        const form = document.getElementById('loginForm');
        const alertDiv = document.getElementById('alert');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const tokenDisplay = document.getElementById('tokenDisplay');
        const tokenBox = document.getElementById('tokenBox');
        
        let currentToken = '';
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                submitBtn.style.display = 'none';
                loadingDiv.style.display = 'block';
                alertDiv.style.display = 'none';
                
                const response = await fetch('http://127.0.0.1:8000/api/citoyen/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentToken = data.token;
                    tokenBox.textContent = data.token;
                    tokenDisplay.style.display = 'block';
                    form.style.display = 'none';
                    showAlert('✅ Connexion réussie !', 'success');
                } else {
                    const errorMsg = data.message || 'Email ou mot de passe incorrect';
                    showAlert('❌ ' + errorMsg, 'error');
                }
            } catch (error) {
                showAlert('❌ Erreur de connexion : ' + error.message, 'error');
            } finally {
                submitBtn.style.display = 'block';
                loadingDiv.style.display = 'none';
            }
        });
        
        function showAlert(message, type) {
            alertDiv.textContent = message;
            alertDiv.className = 'alert ' + type;
            alertDiv.style.display = 'block';
        }
        
        function copyToken() {
            navigator.clipboard.writeText(currentToken).then(() => {
                alert('✅ Token copié !');
            });
        }
    </script>
</body>
</html>
