<div class="wizard-page fade-in">
  <div class="stepper">
    <div class="step step--active"><div class="step__circle">1</div><span class="step__label">Identité</span></div>
    <div class="step__connector"></div>
    <div class="step"><div class="step__circle">2</div><span class="step__label">Coordonnées</span></div>
    <div class="step__connector"></div>
    <div class="step"><div class="step__circle">3</div><span class="step__label">Sécurité</span></div>
    <div class="step__connector"></div>
    <div class="step"><div class="step__circle">4</div><span class="step__label">Pièce d'identité</span></div>
    <div class="step__connector"></div>
    <div class="step"><div class="step__circle">5</div><span class="step__label">Validation</span></div>
  </div>

  <h1 class="wizard-title">Créer votre compte</h1>
  <p class="wizard-subtitle">Commençons par votre identité.</p>

  <form [formGroup]="formulaire" (ngSubmit)="suivant()" class="wizard-form">
    <div class="form-field">
      <label for="nom">Nom <span class="required">*</span></label>
      <input id="nom" type="text" formControlName="nom" />
    </div>

    <div class="form-field">
      <label for="prenom">Prénom <span class="required">*</span></label>
      <input id="prenom" type="text" formControlName="prenom" />
    </div>

    <div class="form-field">
      <label for="sexe">Sexe <span class="required">*</span></label>
      <select id="sexe" formControlName="sexe">
        <option value="" disabled selected>Choisir</option>
        <option value="M">Masculin</option>
        <option value="F">Féminin</option>
      </select>
    </div>

    <div class="form-field">
      <label for="date_naissance">Date de naissance <span class="required">*</span></label>
      <input id="date_naissance" type="date" formControlName="date_naissance" />
    </div>

    <div class="form-field">
      <label for="lieu_naissance">Lieu de naissance <span class="required">*</span></label>
      <input id="lieu_naissance" type="text" formControlName="lieu_naissance" placeholder="Ville, hôpital..." />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Suivant</button>
    </div>
  </form>
</div>
