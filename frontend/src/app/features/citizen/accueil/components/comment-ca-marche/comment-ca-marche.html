<!-- comment-ca-marche.html -->
<section class="ccm">
  <h2>Comment ça marche ?</h2>

  <p class="ccm-notice">
    <span class="ccm-notice-icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2 L20 6 L20 12 C20 17 16.5 20.5 12 22 C7.5 20.5 4 17 4 12 L4 6 Z"/><path d="M9 12 L11 14 L15 10"/></svg>
    </span>
    Plus besoin de voyager vers votre mairie de naissance.
  </p>

  <ol class="ccm-etapes">
    @for (etape of etapes; track etape.num) {
      <li class="ccm-card reveal" >
        <span class="ccm-icon">
          @switch (etape.num) {
            @case (1) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 20 C2 15.5 5 13 9 13"/><line x1="17" y1="8" x2="22" y2="8"/><line x1="19.5" y1="5.5" x2="19.5" y2="10.5"/></svg>
            }
            @case (2) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            }
            @case (3) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7 L12 13 L21 7"/></svg>
            }
          }
        </span>
        <p class="ccm-titre">{{ etape.num }}. {{ etape.titre }}</p>
        <p class="ccm-texte">{{ etape.texte }}</p>
      </li>
    }
  </ol>

  <a routerLink="/nouvelle-demande" class="btn btn-primary">Commencer ma demande</a>
</section>
