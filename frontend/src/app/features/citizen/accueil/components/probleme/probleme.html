<section class="probleme">
  <p class="eyebrow">Le problème</p>
  <h2>Les démarches administratives ne devraient pas être un parcours du combattant.</h2>

  <div class="probleme-list">
    @for (item of items; track item.titre) {
      <article class="probleme-row" appScrollReveal>
        <div class="probleme-head">
          <span class="probleme-icon">
            @switch (item.icon) {
              @case ('warning') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 L22 20 L2 20 Z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
              }
              @case ('clock') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 12 L16 14"/></svg>
              }
              @case ('pencil') {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20 L4 20 L4 16 L15 5 L19 9 Z"/><line x1="13" y1="6" x2="17" y2="10"/></svg>
              }
            }
          </span>
          <h3>{{ item.titre }}</h3>
        </div>
        <p>{{ item.texte }}</p>
      </article>
    }
  </div>
</section>
